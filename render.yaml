services:
  - type: web
    name: taglit-backend
    env: node
    plan: free
    buildCommand: cd backend && npm ci && npm run build
    startCommand: cd backend && npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: DATABASE_CLIENT
        value: postgres
      - key: DATABASE_URL
        fromDatabase:
          name: taglit-database
          property: connectionString
      - key: APP_KEYS
        generateValue: true
      - key: API_TOKEN_SALT
        generateValue: true
      - key: ADMIN_JWT_SECRET
        generateValue: true
      - key: TRANSFER_TOKEN_SALT
        generateValue: true
      - key: JWT_SECRET
        generateValue: true
      - key: ENCRYPTION_KEY
        generateValue: true
      - key: STRAPI_TELEMETRY_DISABLED
        value: 'true'
      - key: STRAPI_DISABLE_UPDATE_NOTIFICATION
        value: 'true'

  - type: pserv
    name: taglit-database
    env: postgres
    plan: free
    envVars:
      - key: POSTGRES_DB
        value: strapi
